<!DOCTYPE html>
<html>
<head>
    <title>Healthcare Appointment App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="mobile">

    <header>
        <h2>🏥 HealthCare App</h2>
    </header>

    <div class="profile">
        <h3>Welcome, Patient</h3>
        <p>Book your healthcare appointments easily.</p>
    </div>

    <div class="services">

        <div class="card">
            <div class="icon">👨‍⚕️</div>
            <h4>Doctors</h4>
        </div>

        <div class="card">
            <div class="icon">📅</div>
            <h4>Appointments</h4>
        </div>

        <div class="card">
            <div class="icon">💊</div>
            <h4>Medicines</h4>
        </div>

        <div class="card">
            <div class="icon">🧪</div>
            <h4>Lab Tests</h4>
        </div>

    </div>

    <h3>Book Appointment</h3>

    <form>

        <label>Patient Name</label><br>
        <input type="text" placeholder="Enter Name"><br><br>

        <label>Select Doctor</label><br>

        <select>
            <option>Dr. Kumar</option>
            <option>Dr. Priya</option>
            <option>Dr. Sharma</option>
        </select>

        <br><br>

        <label>Appointment Date</label><br>
        <input type="date"><br><br>

        <input type="submit" value="Book Appointment">

    </form>

    <footer>

        <a href="#">🏠 Home</a>
        <a href="#">📅 Book</a>
        <a href="#">👤 Profile</a>

    </footer>

</div>

</body>
</html>
