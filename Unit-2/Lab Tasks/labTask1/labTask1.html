<!DOCTYPE html>
<html>
<head>
    <title>Banking Dashboard</title>
</head>

<body style="margin:0; font-family:Arial; background:#f2f2f2;">

    <!-- Header -->
    <div style="background:#004080; color:white; padding:20px; text-align:center;">
        <h1>ABC Bank Dashboard</h1>
    </div>

    <!-- Welcome Section -->
    <div style="padding:20px; text-align:center;">
        <h2>Welcome, Customer</h2>
        <p>Manage your banking services easily.</p>
    </div>

    <!-- Dashboard Cards -->
    <div style="display:flex; justify-content:space-around; flex-wrap:wrap; padding:20px;">

        <div style="background:white; width:220px; padding:20px; margin:10px; border:1px solid gray; text-align:center;">
            <h3>Account Balance</h3>
            <p>₹50,000</p>
        </div>

        <div style="background:white; width:220px; padding:20px; margin:10px; border:1px solid gray; text-align:center;">
            <h3>Transfer Money</h3>
            <button style="padding:10px; background:green; color:white; border:none;">
                Transfer
            </button>
        </div>

        <div style="background:white; width:220px; padding:20px; margin:10px; border:1px solid gray; text-align:center;">
            <h3>Transaction History</h3>
            <p>View Recent Transactions</p>
        </div>

    </div>

    <!-- Footer -->
    <div style="background:#004080; color:white; text-align:center; padding:15px;">
        © 2026 ABC Bank
    </div>

</body>
</html>
