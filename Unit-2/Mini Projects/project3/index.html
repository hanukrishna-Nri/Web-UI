<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Product Showcase</title>
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f2f2f2;">

    <!-- Header -->
    <div style="background:#2c3e50; color:white; text-align:center; padding:20px;">
        <h1>E-Commerce Store</h1>
        <p>Shop Your Favorite Products</p>
    </div>

    <!-- Navigation -->
    <div style="background:#34495e; text-align:center; padding:15px;">
        <a href="#" style="color:white; text-decoration:none; margin:20px;">Home</a>
        <a href="#" style="color:white; text-decoration:none; margin:20px;">Categories</a>
        <a href="#" style="color:white; text-decoration:none; margin:20px;">Products</a>
        <a href="#" style="color:white; text-decoration:none; margin:20px;">Contact</a>
    </div>

    <!-- Categories -->
    <div style="text-align:center; padding:20px;">
        <h2>Product Categories</h2>

        <button style="padding:10px 20px; margin:10px; background:#3498db; color:white; border:none;">
            Electronics
        </button>

        <button style="padding:10px 20px; margin:10px; background:#27ae60; color:white; border:none;">
            Fashion
        </button>

        <button style="padding:10px 20px; margin:10px; background:#e67e22; color:white; border:none;">
            Home Appliances
        </button>
    </div>

    <!-- Products -->
    <div style="display:flex; justify-content:space-around; flex-wrap:wrap; padding:20px;">

        <!-- Product 1 -->
        <div style="background:white; width:220px; padding:15px; margin:10px; text-align:center; border:1px solid gray;">
            <img src="images/image1.jpg" alt="Smartphone" width="180" height="150">
            <h3>Smartphone</h3>
            <p><b>Price:</b> ₹15,999</p>
            <button style="background:green; color:white; padding:10px 20px; border:none;">
                Buy Now
            </button>
        </div>

        <!-- Product 2 -->
        <div style="background:white; width:220px; padding:15px; margin:10px; text-align:center; border:1px solid gray;">
            <img src="images/image2.jpg" alt="Laptop" width="180" height="150">
            <h3>Laptop</h3>
            <p><b>Price:</b> ₹55,999</p>
            <button style="background:green; color:white; padding:10px 20px; border:none;">
                Buy Now
            </button>
        </div>

        <!-- Product 3 -->
        <div style="background:white; width:220px; padding:15px; margin:10px; text-align:center; border:1px solid gray;">
            <img src="images/image3.jpg" alt="Headphones" width="180" height="150">
            <h3>Headphones</h3>
            <p><b>Price:</b> ₹2,499</p>
            <button style="background:green; color:white; padding:10px 20px; border:none;">
                Buy Now
            </button>
        </div>

    </div>

    <!-- Footer -->
    <div style="background:#2c3e50; color:white; text-align:center; padding:15px; margin-top:20px;">
        <p>&copy; 2026 E-Commerce Product Showcase. All Rights Reserved.</p>
    </div>

</body>
</html>
