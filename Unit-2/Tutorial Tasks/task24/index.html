<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Bootstrap Cards</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Professional Cards</h2>

    <div class="row">

        <div class="col-md-4 mb-4">
            <div class="card custom-card">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Card Image">
                <div class="card-body">
                    <h5 class="card-title">Web Design</h5>
                    <p class="card-text">
                        Create modern and responsive website designs.
                    </p>
                    <a href="#" class="btn btn-primary">Read More</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card custom-card">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Card Image">
                <div class="card-body">
                    <h5 class="card-title">Development</h5>
                    <p class="card-text">
                        Build powerful web applications using modern tools.
                    </p>
                    <a href="#" class="btn btn-success">Read More</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card custom-card">
                <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Card Image">
                <div class="card-body">
                    <h5 class="card-title">Marketing</h5>
                    <p class="card-text">
                        Promote your business with digital marketing strategies.
                    </p>
                    <a href="#" class="btn btn-danger">Read More</a>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
