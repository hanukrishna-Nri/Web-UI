<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Bootstrap Grid Layout</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <div class="row">
            <div class="col-12 header">
                <h1>My Website</h1>
            </div>
        </div>

        <!-- Content Section -->
        <div class="row mt-3">

            <div class="col-lg-3 col-md-4 col-sm-12 sidebar">
                <h3>Sidebar</h3>
                <p>Navigation Links</p>
            </div>

            <div class="col-lg-9 col-md-8 col-sm-12 content">
                <h3>Main Content</h3>
                <p>
                    This layout uses Bootstrap Grid System.
                    It automatically adjusts for desktop,
                    tablet, and mobile devices.
                </p>
            </div>

        </div>

        <!-- Services Section -->
        <div class="row mt-3">

            <div class="col-lg-4 col-md-6 col-sm-12 service">
                <h4>Service 1</h4>
            </div>

            <div class="col-lg-4 col-md-6 col-sm-12 service">
                <h4>Service 2</h4>
            </div>

            <div class="col-lg-4 col-md-12 col-sm-12 service">
                <h4>Service 3</h4>
            </div>

        </div>

        <!-- Footer -->
        <div class="row mt-3">
            <div class="col-12 footer">
                <p>© 2026 Responsive Layout</p>
            </div>
        </div>

    </div>

</body>
</html>
