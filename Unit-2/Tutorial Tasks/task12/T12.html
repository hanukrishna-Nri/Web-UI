<!DOCTYPE html>
<html>
<head>
    <title>Responsive Flexbox Gallery</title>

    <style>
        body{
            font-family: Arial;
            text-align: center;
        }

        .gallery{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .gallery img{
            width: 200px;
            height: 150px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

<h2>Image Gallery</h2>

<div class="gallery">
    <img src="https://placehold.net/avatar-2.png" alt="Image 1">
    <img src="https://placehold.net/map-400x600.png" alt="Image 2">
    <img src="https://placehold.net/building-400x600.png" alt="Image 3">
    <img src="https://placehold.net/product-400x600.png" alt="Image 4">
</div>

</body>
</html>
