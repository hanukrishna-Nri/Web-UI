<!DOCTYPE html>
<html>

<head>
    <title>Loading Animation Design</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <h1>Loading Animation Design</h1>


    <h2>Spinner Loading</h2>

    <div class="spinner"></div>

    <div class="dots">

        <div class="dot"></div>

        <div class="dot"></div>

        <div class="dot"></div>

    </div>


</body>

</html>
