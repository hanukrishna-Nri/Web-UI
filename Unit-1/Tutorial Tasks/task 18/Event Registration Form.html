<!DOCTYPE html>
<html>
<head>
    <title>Event Registration Form</title>
  <!--  <link rel="stylesheet" href="../CSS/style.css"> --> 
</head>

<body>

    <!-- Main Heading -->
    <h1>Event Registration Form</h1>

    <!-- Registration Form -->
    <form>

        <h2>Participant Details</h2>

        <label>Full Name</label>
        <input type="text" placeholder="Enter your name">
<br><br>
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email">
<br><br>
        <label>Phone Number</label>
        <input type="tel" placeholder="Enter phone number">


        <h2>Event Details</h2>

        <label>Select Event</label>
        <select>
            <option>Workshop</option>
            <option>Seminar</option>
            <option>Hackathon</option>
            <option>Cultural Event</option>
            <option>Sports Event</option>
        </select>
<br><br>
        <label>Event Date</label>
        <input type="date">
<br><br>

        <label>Participant Category</label>
<br><br>
        <input type="radio" name="category"> Student
        <input type="radio" name="category"> Faculty
        <input type="radio" name="category"> Guest

<br><br>
        <label>College / Organization Name</label>
        <input type="text" placeholder="Enter organization name">
<br><br>

        <label>Address</label>
        <textarea placeholder="Enter your address"></textarea>
<br><br>

        <label>Special Requirements</label>
        <textarea placeholder="Any additional requirements"></textarea>

<br><br>
<br><br>
    <!-- Buttons -->
        <div class="buttons">
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </div>

    </form>

</body>
</html>
